name: Release

# A v* tag builds the Windows exe, checks that the packaged app really starts, and
# attaches the zip to a DRAFT release; publishing the draft stays a manual step.
# Run it by hand (workflow_dispatch) to get the zip as a workflow artifact only.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-exe:
    name: Windows exe
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Validate release version
        shell: pwsh
        run: |
          @'
          import ast
          import os
          import re
          from pathlib import Path
          try:
              import tomllib
          except ImportError:
              import tomli as tomllib

          project_version = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"]
          tree = ast.parse(Path("backend/app/core/config.py").read_text(encoding="utf-8"))
          settings = next(node for node in tree.body if isinstance(node, ast.ClassDef) and node.name == "Settings")
          declaration = next(node for node in settings.body if isinstance(node, ast.AnnAssign)
                             and isinstance(node.target, ast.Name) and node.target.id == "VERSION")
          settings_version = ast.literal_eval(declaration.value)
          if project_version != settings_version:
              raise SystemExit("pyproject and Settings versions differ.")
          if os.environ.get("GITHUB_REF_TYPE") == "tag":
              tag = os.environ["GITHUB_REF_NAME"]
              match = re.fullmatch(r"v((?:0|[1-9]\d*)\.(?:0|[1-9]\d*)\.(?:0|[1-9]\d*))(?:-(alpha|beta|rc)\.([1-9]\d*))?", tag)
              if match is None or match.group(1) != project_version:
                  raise SystemExit("Release tag must match the project version and supported prerelease format.")
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -c constraints.txt -r backend/requirements.txt -r desktop/requirements.txt -r build-windows/requirements.txt
          python -m pip check

      - name: Run tests
        run: python -m pytest -q

      - name: Build
        run: pyinstaller build-windows/aimonitor.spec --noconfirm

      - name: Smoke-test the packaged exe
        shell: pwsh
        run: |
          # A throwaway home, so the exe's ~/.aimonitor data folder starts empty like a new user's.
          $env:USERPROFILE = Join-Path $env:RUNNER_TEMP "home"
          $env:HOME = $env:USERPROFILE
          $env:APPDATA = Join-Path $env:USERPROFILE "roaming"
          $env:LOCALAPPDATA = Join-Path $env:USERPROFILE "local"
          New-Item -ItemType Directory -Force $env:USERPROFILE | Out-Null
          $logs = Join-Path $env:USERPROFILE ".aimonitor\logs"
          $exe = "dist\AIMONITOR\AIMONITOR.exe"
          $check = Start-Process $exe -ArgumentList "--self-test" -WindowStyle Hidden -Wait -PassThru
          if ($check.ExitCode -ne 0) { Get-Content "$logs\self-test.log"; exit 1 }
          $server = Start-Process $exe -ArgumentList "--serve-backend" -WindowStyle Hidden -PassThru
          $ready = $false
          foreach ($i in 1..60) {
            Start-Sleep -Milliseconds 500
            try { Invoke-RestMethod http://127.0.0.1:8000/health | Out-Null; $ready = $true; break } catch {}
          }
          try {
            if (-not $ready) { throw "backend did not answer /health" }
            $trace = '{"provider":"openai","model_name":"gpt-4o","prompt_tokens":1,"completion_tokens":1}'
            Invoke-RestMethod -Method Post http://127.0.0.1:8000/api/v1/traces -ContentType application/json -Body $trace | Out-Null
            $total = (Invoke-RestMethod http://127.0.0.1:8000/api/v1/metrics/overview).total_requests
            if ($total -ne 1) { throw "expected 1 stored trace, got $total" }
          } catch {
            Get-Content "$logs\backend.log"; throw
          } finally {
            Stop-Process -Id $server.Id -Force
          }

      - name: Zip and checksum
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq "tag") { $env:GITHUB_REF_NAME } else { "dev-" + $env:GITHUB_SHA.Substring(0, 7) }
          $zip = "AIMONITOR-$version-windows-x64.zip"
          Compress-Archive -Path dist\AIMONITOR -DestinationPath $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          [System.IO.File]::WriteAllText("$zip.sha256", ("$hash  $zip" + [char]10), [System.Text.Encoding]::ASCII)
          "ZIP=$zip" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: aimonitor-windows
          path: |
            ${{ env.ZIP }}
            ${{ env.ZIP }}.sha256

  publish:
    name: Draft release
    needs: windows-exe
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: aimonitor-windows

      - name: Verify checksum and create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          archive="AIMONITOR-$RELEASE_TAG-windows-x64.zip"
          sha256sum -c "$archive.sha256"
          prerelease=()
          if [[ "$RELEASE_TAG" == *-* ]]; then prerelease+=(--prerelease); fi
          gh release create "$RELEASE_TAG" "$archive" "$archive.sha256" --draft \
            --title "AIMONITOR $RELEASE_TAG" --generate-notes "${prerelease[@]}"
