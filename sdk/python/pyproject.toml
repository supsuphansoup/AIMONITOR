[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aimonitor-sdk"
version = "0.3.0"
description = "Python client SDK for the AIMONITOR LLM observability platform"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["httpx>=0.27.0"]

[project.urls]
Homepage = "https://github.com/supsuphansoup/AIMONITOR"

[tool.setuptools]
packages = ["aimonitor"]
